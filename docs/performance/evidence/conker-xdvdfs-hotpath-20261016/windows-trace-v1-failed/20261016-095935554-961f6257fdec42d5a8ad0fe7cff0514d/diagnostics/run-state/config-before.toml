[general]
show_welcome = false
skip_boot_anim = true
[input]
auto_bind = false
background_input_capture = false
[input.virtual_ports]
port1_connected = 1
[input.bindings]
port1_driver = 'usb-xbox-gamepad'
port1 = 'keyboard'
[display]
renderer = 'VULKAN'
[display.window]
startup_size = '1280x720'
vsync = false
[audio]
use_dsp_jit = true
[sys]
mem_limit = '64'
[sys.files]
flashrom_path = '{packageDir}/flash.bin'
bootrom_path = '{runtimeDir}/bootrom.bin'
eeprom_path = '{runtimeDir}/eeprom.bin'
hdd_path = '{runtimeDir}/hdd.qcow2'
dvd_path = '{packageDir}/game.iso'
[perf]
cache_shaders = false
