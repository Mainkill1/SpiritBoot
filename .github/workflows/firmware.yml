name: Open firmware
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      metadata_counters:
        description: Enable aggregate metadata diagnostics (not a performance build)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/host -v
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
        memory_mib: [64, 128]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned open kernel
        run: |
          python3 - <<'PY'
          import json, subprocess
          lock = json.load(open('sources/firmware-lock.json'))['repositories']['roswell']
          subprocess.run(['git', 'init', '.reference/roswell'], check=True)
          subprocess.run(['git', '-C', '.reference/roswell', 'remote', 'add', 'origin', lock['url']], check=True)
          subprocess.run(['git', '-C', '.reference/roswell', 'fetch', '--depth=1', 'origin', lock['revision']], check=True)
          subprocess.run(['git', '-C', '.reference/roswell', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Build toolchain
        run: docker build -f tools/Dockerfile.firmware -t spiritboot-toolchain .
      - name: Build flash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            spiritboot-toolchain python3 scripts/build-firmware.py \
            --source .reference/roswell --output artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib \
            --variant ${{ matrix.variant }} --memory-mib ${{ matrix.memory_mib }} ${{ inputs.metadata_counters && '--metadata-counters' || '' }}
      - name: Check the built source identity and actual kernel work
        run: |
          guest_source=$(python3 -c 'import json; print(json.load(open("artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.json"))["source_directory"])')
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            -e GUEST_SOURCE="$guest_source" -e VARIANT=${{ matrix.variant }}-${{ matrix.memory_mib }}mib \
            spiritboot-toolchain sh -ec '
            output="artifacts/kernel-host-$VARIANT"
            mkdir -p "$output"
            actual_tree=$(git -c "safe.directory=$GUEST_SOURCE" -C "$GUEST_SOURCE" write-tree)
            test "$actual_tree" = 65fb8c399fc4478438f4e4e1983b8ac3557791ed
            python3 "$GUEST_SOURCE/tests/host/relocation/check-capacity.py" "$output/relocation-capacity" >"$output/relocation-capacity.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/relocation/check-destinations.py" "$output/relocation-destinations" >"$output/relocation-destinations.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/cache/check-pin-unwind.py" "$output/cache-pin-unwind" >"$output/cache-pin-unwind.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/cache/check-pin-arguments.py" "$output/cache-pin-arguments" >"$output/cache-pin-arguments.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/cache/check-pin-reuse.py" "$output/cache-pin-reuse" >"$output/cache-pin-reuse.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/cache/check-writeback.py" "$output/cache-writeback" >"$output/cache-writeback.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/cache/check-shrink.py" "$output/cache-shrink" >"$output/cache-shrink.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/fatx/check-fatx32.py" "$output/fatx32" >"$output/fatx32.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/fatx/check-chain-walk.py" "$output/fat-chain-walk" >"$output/fat-chain-walk.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/metadata/check.py" "$output/metadata" >"$output/metadata.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/zero-reuse/check.py" "$output/zero-reuse" >"$output/zero-reuse.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/dma-lifetime/check.py" "$output/dma-lifetime" >"$output/dma-lifetime.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/io-apc-order/check.py" "$output/io-apc-order" >"$output/io-apc-order.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/critical-section/check.py" "$output/critical-section" >"$output/critical-section.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xdvdfs/check.py" "$output/xdvdfs-create" >"$output/xdvdfs-create.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xdvdfs-directory/check.py" "$output/xdvdfs-directory" >"$output/xdvdfs-directory.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xdvdfs-masks/check.py" "$output/xdvdfs-masks" >"$output/xdvdfs-masks.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xdvdfs-read-completion/check.py" "$output/xdvdfs-read-completion" >"$output/xdvdfs-read-completion.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xbox-rename/check.py" "$GUEST_SOURCE" "$output/xbox-rename" >"$output/xbox-rename.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/video-aspect/check.py" "$GUEST_SOURCE" "$output/video-aspect" >"$output/video-aspect.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/xbe-media/check.py" "$GUEST_SOURCE" "$output/xbe-media" >"$output/xbe-media.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/tap-uart/check.py" "$output/tap-uart" >"$output/tap-uart.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/thread-wait/check.py" "$output/thread-wait" >"$output/thread-wait.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/thread-stack/check.py" "$output/thread-stack" >"$output/thread-stack.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/zero-alias/check.py" "$output/zero-alias" >"$output/zero-alias.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/pool-size/check.py" "$output/pool-size" >"$output/pool-size.log" 2>&1
            "$GUEST_SOURCE/tests/host/clean-room/run.sh" "$output/clean-room" >"$output/clean-room.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/kernel-performance/check.py" "$GUEST_SOURCE" "$output/optimization" --optimized >"$output/optimization.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/kernel-performance/pins.py" "$GUEST_SOURCE" "$output/pins" --optimized --vector >"$output/pins.log" 2>&1
            python3 "$GUEST_SOURCE/tests/host/kernel-performance/pins.py" "$GUEST_SOURCE" "$output/pins-diagnostics" --optimized --vector --diagnostics >"$output/pins-diagnostics.log" 2>&1'
      - name: Verify clean release rebuild
        if: matrix.variant == 'release'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            spiritboot-toolchain python3 scripts/build-firmware.py \
            --source .reference/roswell --output artifacts/firmware-repeat --memory-mib ${{ matrix.memory_mib }} ${{ inputs.metadata_counters && '--metadata-counters' || '' }}
          cmp artifacts/firmware-release/flash.bin artifacts/firmware-repeat/flash.bin
      - name: Prepare pinned open runtime fixtures
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          fixtures = json.load(open('sources/firmware-lock.json'))['fixtures']
          for name, url, digest in (
              ('xemu.AppImage', fixtures['xemu_linux']['url'], fixtures['xemu_linux']['sha256']),
              ('xbox_hdd.qcow2', fixtures['hdd_url'], fixtures['hdd_sha256']),
          ):
              path = pathlib.Path('artifacts') / name
              urllib.request.urlretrieve(url, path)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          pathlib.Path('artifacts/xemu.AppImage').chmod(0o755)
          PY
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
            -w /work/artifacts spiritboot-toolchain ./xemu.AppImage --appimage-extract
      - name: Build guests from the tested patched source
        run: |
          nxdk_image=$(python3 -c 'import json; print(json.load(open("sources/firmware-lock.json"))["fixtures"]["nxdk_container"])')
          guest_source=$(python3 -c 'import json; print(json.load(open("artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.json"))["source_directory"])')
          kernel_build=$(python3 -c 'import json; print(json.load(open("artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.json"))["build_directory"])')
          for guest in api-regression clean-room-contracts clean-room-warm-reboot kernel-performance $(python3 -c 'import json; print(" ".join(json.load(open("sources/native-regressions.json"))))'); do
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" \
              -e KERNEL_ASM="$kernel_build/sdk/include/asm/ks386.inc" \
              -e PATH=/usr/src/nxdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              -w "$guest_source/tests/xbe/$guest" \
              "$nxdk_image" make NXDK_DIR=/usr/src/nxdk
          done
      - name: Run API, contracts, warm reboot, and performance correctness guests
        run: |
          guest_source=$(python3 -c 'import json; print(json.load(open("artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.json"))["source_directory"])')
          docker run --rm -v "$PWD:/work" \
            -e GUEST_SOURCE="$guest_source" -e VARIANT=${{ matrix.variant }}-${{ matrix.memory_mib }}mib \
            -e MEMORY_MIB=${{ matrix.memory_mib }} -e SDL_AUDIO_DRIVER=dummy spiritboot-toolchain sh -ec '
            Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
            python3 -c "import time; time.sleep(1)"
            for guest in api-regression clean-room-contracts clean-room-warm-reboot kernel-performance $(python3 -c "import json; print(\" \".join(json.load(open(\"sources/native-regressions.json\"))))"); do
              case "$guest" in
                api-regression) iso=nxkrnl-api-regression.iso; capture=open-xbe ;;
                clean-room-contracts|clean-room-warm-reboot|kernel-performance) iso=$guest.iso; capture=$guest ;;
                *) iso=$(python3 -c "import json,sys; print(json.load(open(\"sources/native-regressions.json\"))[sys.argv[1]][\"iso\"])" "$guest"); capture=$guest ;;
              esac
              DISPLAY=:99 python3 scripts/run-firmware.py \
                --xemu artifacts/squashfs-root/usr/bin/xemu \
                --flash "artifacts/firmware-$VARIANT/flash.bin" \
                --hdd artifacts/xbox_hdd.qcow2 \
                --dvd "$GUEST_SOURCE/tests/xbe/$guest/$iso" \
                --memory-mib "$MEMORY_MIB" --output "artifacts/$capture-$VARIANT" --timeout 240 --expect-tap
            done'
          python3 - <<'PY'
          import json
          for guest, plan in (('clean-room-contracts', 23), ('clean-room-warm-reboot', 5)):
              result = json.load(open(f'artifacts/{guest}-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/run.json'))
              assert result['status'] == 'passed' and result['tap']['plan'] == plan, result
              assert result['tap']['ok'] == plan, result
              assert result['tap']['todo'] == 0 and result['tap']['skipped'] == 0, result
          PY
          python3 - <<'PY'
          import json
          variant = "${{ matrix.variant }}-${{ matrix.memory_mib }}mib"
          for guest, contract in json.load(open('sources/native-regressions.json')).items():
              result = json.load(open(f'artifacts/{guest}-{variant}/run.json'))
              assert result['status'] == 'passed', result
              tap = result['tap']
              assert tap['plan'] == tap['ok'] == contract['checks'], result
              assert tap['failed'] == tap['todo'] == tap['skipped'] == 0, result
          PY
          python3 - <<'PY'
          from pathlib import Path
          from tools.kernel_performance import capture
          result = capture(Path('artifacts/kernel-performance-${{ matrix.variant }}-${{ matrix.memory_mib }}mib'), {})
          assert len(result['workloads']) == 41, result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spiritboot-${{ matrix.variant }}-${{ matrix.memory_mib }}mib
          path: |
            artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/flash.bin
            artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.json
            artifacts/firmware-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/build.log
            artifacts/open-xbe-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/clean-room-contracts-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/clean-room-warm-reboot-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/kernel-performance-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/pool-size-limit-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/zero-reuse-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/thread-stack-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/thread-wait-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/xdvdfs-directory-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/xdvdfs-related-directory-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/critical-section-contention-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/io-apc-order-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            artifacts/kernel-host-${{ matrix.variant }}-${{ matrix.memory_mib }}mib/
            LICENSE
