name: Dashboard memory fixture
on:
  push:
    paths: ['tests/dashboard/**', 'tools/dashboard_memory.py', 'tests/host/test_dashboard_memory.py', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['tests/dashboard/**', 'tools/dashboard_memory.py', 'tests/host/test_dashboard_memory.py', '.github/workflows/dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Observation contracts
        run: python3 -m unittest discover -s tests/host -p test_dashboard_memory.py -v
      - name: Build original dashboard with pinned nxdk
        run: |
          docker run --rm -v "$PWD/tests/dashboard:/work" -w /work \
            ghcr.io/xboxdev/nxdk@sha256:bab707b7ed2544e9956d51e7b411a4575ab66120bd608b3237698495203d15f7 make -j2
          sudo cp tests/dashboard/bin/default.xbe tests/dashboard/bin/xboxdash.xbe
          docker run --rm -v "$PWD/tests/dashboard:/work" -w /work \
            ghcr.io/xboxdev/nxdk@sha256:bab707b7ed2544e9956d51e7b411a4575ab66120bd608b3237698495203d15f7 \
            sh -c 'rm -f main.obj main.exe bin/default.xbe; make -j2 DVD_LAUNCH=1'
          sudo cp tests/dashboard/bin/default.xbe tests/dashboard/bin/xboxdash-launch-dvd.xbe
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-memory-probe
          path: tests/dashboard/bin/xboxdash*.xbe
