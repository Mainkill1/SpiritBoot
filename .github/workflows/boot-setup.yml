name: Boot setup contract (host only)
on:
  pull_request:
    paths:
      - 'src/boot/setup/**'
      - 'tests/host/boot-setup/**'
      - 'tools/boot_setup_demo.c'
      - '.github/workflows/boot-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test menu logic, failure paths and freestanding i386 footprint
        run: python3 tests/host/boot-setup/check.py --output "$RUNNER_TEMP/boot-setup"
